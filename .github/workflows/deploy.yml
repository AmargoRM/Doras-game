name: Publicar juego en Cloudflare

# Corre al hacer push a main o a la rama de desarrollo, y manualmente desde la pestaña Actions.
on:
  push:
    branches:
      - main
      - claude/vigilant-hopper-7kj6dg
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Traer el código
        uses: actions/checkout@v4

      - name: Verificar que los secrets estén cargados
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Faltan los secrets CLOUDFLARE_API_TOKEN y/o CLOUDFLARE_ACCOUNT_ID. Agregalos en Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Instalar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Wrangler
        run: npm install -g wrangler@4

      - name: Crear el almacén de puntajes (solo la primera vez)
        run: |
          find_id() {
            wrangler kv namespace list | jq -r '[.[] | select(.title | endswith("doras-scores"))][0].id // empty'
          }
          ID=$(find_id)
          if [ -z "$ID" ]; then
            wrangler kv namespace create doras-scores
            ID=$(find_id)
          fi
          if [ -z "$ID" ]; then
            echo "::error::No se pudo crear ni encontrar el almacén KV 'doras-scores'."
            exit 1
          fi
          echo "Almacén de puntajes: $ID"
          sed -i "s/__KV_ID__/$ID/" wrangler.toml

      - name: Publicar
        run: wrangler deploy
