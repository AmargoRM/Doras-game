name = "doras-survivor"
main = "worker/index.js"
compatibility_date = "2025-01-01"

# El juego (HTML, JS e imágenes) se sirve desde public/.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Almacén de puntajes. El id lo completa automáticamente el workflow de GitHub
# (.github/workflows/deploy.yml). Para probar en tu compu con "wrangler dev" no hace falta.
[[kv_namespaces]]
binding = "SCORES"
id = "__KV_ID__"
