<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1f6b3a">
<title>Doras Survivor</title>
<meta name="description" content="Runner web: Doras y Botas esquivan la comida más engordadora de la selva urbana.">
<link rel="icon" href="assets/doras.webp">
<style>
  :root {
    --bg: #12351f;
    --ink: #fff8e7;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #wrap {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    border-radius: 14px;
    box-shadow: 0 10px 40px rgba(0,0,0,.45);
    background: #2d8a4e;
  }
  @media (max-width: 600px) {
    canvas { border-radius: 0; box-shadow: none; }
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" aria-label="Doras Survivor"></canvas></div>
<script src="game.js"></script>
</body>
</html>
